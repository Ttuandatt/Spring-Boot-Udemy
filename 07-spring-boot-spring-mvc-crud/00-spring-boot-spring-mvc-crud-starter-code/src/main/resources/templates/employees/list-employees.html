<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Employee Directory</h3>
    <hr>

    <!-- Hàng chứa Add Employee và dropdown Order By -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Nút Add Employee -->
        <a th:href="@{/employees/showAddForm}" class="btn btn-primary">
            Add Employee
        </a>

        <!-- Dropdown Order By -->
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="orderByDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Order by Last Name
            </button>
            <ul class="dropdown-menu" aria-labelledby="orderByDropdown">
                <li>
                    <a class="dropdown-item" th:href="@{/employees/list(sort='lastNameAsc')}">
                        Ascending
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" th:href="@{/employees/list(sort='lastNameDesc')}">
                        Descending
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="employee: ${employeeList}">
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
