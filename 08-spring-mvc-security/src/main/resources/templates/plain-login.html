<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- xmlns is a unique identifier for XML elements, attributes-->
<head>
    <meta charset="UTF-8">
    <title>Custom Login Page</title>

    <style>
        .failed{
            color: red;
        }
    </style>
</head>
<body>
<h1>My custom login page</h1>
<hr>
<form action="#" th:action="@{/authenticateTheUser}" method="POST">
    <div th:if="${param.error}">
        <i class="failed">Invalid username and password.<i>
    </div>

    <p>
        Username: <input type="text" name="username"/>
    </p>

    <p>
        Password: <input type="password" name="password"/>
    </p>

    <input type="submit" value="Login"/>
</form>
</body>
</html>
