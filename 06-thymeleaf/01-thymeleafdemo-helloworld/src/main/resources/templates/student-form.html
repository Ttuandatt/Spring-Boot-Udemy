<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Input Form</title>
    <meta charset="utf-8" />
</head>
<body>
    <form th:action="@{/processStudentForm}" th:object="${student}" method="POST">
        Fisrt Name: <input type="text" th:field="*{firstName}" placeholder="Enter first name" /><br><br>
        Last Name: <input type="text" th:field="*{lastName}" placeholder="Enter last name" /><br><br>
        Country:
        <select th:field="*{country}">  // *{country} is the field in the Student class
            <option th:each="tempCountry: ${countries}" th:value="${tempCountry}" th:text="${tempCountry}"/>
        </select><br><br>
        Favorite Language: <!--*{favoriteLanguage} is the field in the Student class-->
        <input type="radio" th:field="*{favoriteLanguage}" th:each="tempLang : ${languages}" th:value="${tempLang}" th:text="${tempLang}"/>
        <br><br>
        Favorite OS:
        <input type="checkbox" th:field="*{favoriteOS}" th:each="tempOS: ${systems}" th:value="${tempOS}" th:text="${tempOS}"/><br><br>

        <input type="submit" value="Submit" />
    </form>
</body>
</html>
