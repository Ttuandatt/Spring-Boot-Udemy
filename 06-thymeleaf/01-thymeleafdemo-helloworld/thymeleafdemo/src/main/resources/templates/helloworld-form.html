<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Input Form</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Input Form</h1>
    <form th:action="@{/processFormVersionTwo}" method="GET">
        <label >Student Name:</label>
        <input type="text" name="studentName" placeholder="What's your name?"/><br><br>
        <label >Age:</label>
        <input type="number" name="age" placeholder="How old are you?"/> <br><br>
        <input type="submit" value="Submit"/>
    </form>
</body>
</html>
