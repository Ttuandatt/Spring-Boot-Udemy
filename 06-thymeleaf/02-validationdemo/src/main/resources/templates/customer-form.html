<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <form th:action="@{/processCustomerForm}" th:object="${customer}" method="POST">
        First Name: <input type="text" th:field="*{firstName}"/><br><br>
        Last Name: <input type="text" th:field="*{lastName}"/><span style="color: red"> *</span>

        <!-- Add error message for last name -->
        <span th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"
              class="error">
        </span>


        <br><input type="submit" value="Submit"/><br><br>
        <span style="color: red">Asterick (*) indicates a required field.</span><br><br>
    </form>
</body>
</html>
